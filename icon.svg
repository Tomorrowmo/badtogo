<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#1a1f3d"/>
      <stop offset="100%" stop-color="#06070f"/>
    </radialGradient>
    <linearGradient id="hot" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff5a4d"/>
      <stop offset="100%" stop-color="#ff9540"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- 上半：碎裂的暖色（发泄） -->
  <g fill="url(#hot)">
    <polygon points="150,150 210,140 190,210 140,200"/>
    <polygon points="220,135 290,150 270,205 215,205"/>
    <polygon points="300,150 360,160 350,215 280,210"/>
  </g>
  <!-- 下半：平复的青色圆（呼吸） -->
  <circle cx="256" cy="330" r="74" fill="none" stroke="#36d6c3" stroke-width="14"/>
  <circle cx="256" cy="330" r="30" fill="#36d6c3" opacity="0.85"/>
</svg>
