# BadToGo · 阿里云轻量服务器「换端口」部署配置（不影响 80 端口现有网站）
# 放置位置：/etc/nginx/conf.d/badtogo-9000.conf
# 站点文件目录：/var/www/badtogo
# 访问：http://39.96.207.137:9000
#
# 注意：http(非 https) 下浏览器不启用 Service Worker，故"离线安装/吼模式麦克风"不可用；
#       其余功能（撕/砸/捶/呼吸/记录/趋势/分享）全部正常。要恢复需配域名+HTTPS。

server {
    listen 9000;
    listen [::]:9000;
    server_name _;

    root /var/www/badtogo;
    index index.html;

    location = /manifest.webmanifest { default_type application/manifest+json; }

    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        default_type application/javascript;
    }

    location ~* \.(css|js|svg|png|webmanifest)$ {
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    add_header X-Content-Type-Options "nosniff" always;
    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/manifest+json;
}
