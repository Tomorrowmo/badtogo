# BadToGo · 阿里云轻量服务器 nginx 站点配置
# 放置位置：/etc/nginx/conf.d/badtogo.conf
# 把 YOUR_DOMAIN 改成你的域名；网站文件放在 /var/www/badtogo
#
# 说明：吼出来(麦克风)功能需要 HTTPS。下方含 HTTP→HTTPS 跳转与 HTTPS 站点。
# 证书用 certbot 自动签发后会自动改写本文件（见 DEPLOY-阿里云.md）。

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN;

    # Let's Encrypt 验证目录
    location /.well-known/acme-challenge/ {
        root /var/www/badtogo;
    }
    # 其余一律跳转 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name YOUR_DOMAIN;

    root /var/www/badtogo;
    index index.html;

    # ---- 证书（certbot 会自动填好这两行；手动可改）----
    # ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;

    # PWA manifest 正确 MIME
    location = /manifest.webmanifest {
        default_type application/manifest+json;
    }

    # Service Worker 不缓存，保证能及时更新
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        default_type application/javascript;
    }

    # 静态资源缓存（带 hash 时可加长；当前文件名固定故用短缓存）
    location ~* \.(css|js|svg|png|webmanifest)$ {
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    # SPA 回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 安全响应头
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/manifest+json;
}
